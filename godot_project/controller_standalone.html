<body class="h-full w-full text-slate-100 font-mono flex flex-col bg-[#06090E] bg-hud-grid bg-[length:32px_32px]">

  <!-- Tactical Feedback Flash Overlay (Screen border pulses on hits, kills, damage) -->
  <div id="tacticalFlashOverlay" class="pointer-events-none fixed inset-0 z-40 transition-opacity duration-150 opacity-0"></div>

  <!-- ===================================================================== -->
  <!-- 1. TOP STATUS & TELEMETRY BAR                                         -->
  <!-- ===================================================================== -->
  <header class="w-full bg-vanguard-panel/90 border-b border-vanguard-border backdrop-blur-md px-3 py-1.5 flex items-center justify-between text-xs z-30 shrink-0">
    <div class="flex items-center gap-2">
      <div id="connectionPill" class="flex items-center gap-1.5 px-2 py-0.5 rounded border border-red-500/50 bg-red-950/40 text-red-400 font-bold tracking-wider">
        <span id="connectionDot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
        <span id="connectionText">DISCONNECTED</span>
      </div>
      <div class="hidden sm:flex items-center text-vanguard-cyanDim tracking-widest font-display font-semibold">
        <span id="headerCallsign">CALLSIGN: WINGMAN-2</span>
      </div>
    </div>

    <!-- Center Mode & Calibrate Controls -->
    <div class="flex items-center gap-1.5">
      <button id="tareHorizonBtn" title="Instant 1-tap horizon zero calibration" class="px-2.5 py-1 rounded border border-vanguard-amber/80 bg-vanguard-amber/20 hover:bg-vanguard-amber/30 text-vanguard-amber text-[11px] font-black tracking-wider flex items-center gap-1 active:scale-95 shadow-[0_0_10px_rgba(255,179,0,0.3)] transition-all">
        <span>🎯</span>
        <span>TARE HORIZON</span>
      </button>
      <button id="toggleSteerModeBtn" class="px-2.5 py-1 rounded border border-vanguard-cyan/60 bg-vanguard-cyan/10 hover:bg-vanguard-cyan/20 text-vanguard-cyan text-[11px] font-bold tracking-wider flex items-center gap-1 active:scale-95 transition-all">
        <span id="steerModeIcon">🕹️</span>
        <span id="steerModeText">TOUCH STICK</span>
      </button>
      <button id="calibrateGyroBtn" class="hidden px-2 py-1 rounded border border-vanguard-amber/60 bg-vanguard-amber/10 text-vanguard-amber text-[11px] font-bold active:scale-95 transition-all">
        ⌖ ZERO
      </button>
      <button id="toggleAudioBtn" class="px-2 py-1 rounded border border-vanguard-border bg-vanguard-panel text-slate-400 text-[11px] active:scale-95">
        🔊
      </button>
      <button id="openConfigBtn" class="px-2 py-1 rounded border border-vanguard-border bg-vanguard-panel text-slate-400 text-[11px] active:scale-95">
        ⚙️
      </button>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- 2. COCKPIT HUD INSTRUMENTS (Vitals & Threat Banner)                   -->
  <!-- ===================================================================== -->
  <div class="w-full bg-[#090E17]/80 border-b border-vanguard-border/50 px-3 py-1 flex items-center justify-between text-[11px] shrink-0 z-20">
    <!-- Shields -->
    <div class="flex items-center gap-2 w-1/4">
      <span class="text-vanguard-cyan font-bold tracking-wider">SHD</span>
      <div class="flex-1 h-2 bg-slate-900 rounded-sm overflow-hidden border border-vanguard-border">
        <div id="shieldBar" class="h-full bg-vanguard-cyan shadow-[0_0_8px_#00e5ff] transition-all duration-150" style="width: 100%;"></div>
      </div>
      <span id="shieldText" class="text-vanguard-cyan w-7 text-right font-bold">100</span>
    </div>

    <!-- Threat Alarm / Center Info -->
    <div class="flex-1 px-2 text-center overflow-hidden">
      <div id="threatBanner" class="text-emerald-400 font-bold tracking-widest truncate">
        // READY FOR SORTIE // ALL SYSTEMS NOMINAL //
      </div>
    </div>

    <!-- Hull -->
    <div class="flex items-center gap-2 w-1/4 justify-end">
      <span id="hullText" class="text-emerald-400 w-7 text-left font-bold">100</span>
      <div class="flex-1 h-2 bg-slate-900 rounded-sm overflow-hidden border border-vanguard-border">
        <div id="hullBar" class="h-full bg-emerald-400 shadow-[0_0_8px_#00e676] transition-all duration-150" style="width: 100%;"></div>
      </div>
      <span class="text-emerald-400 font-bold tracking-wider">HUL</span>
    </div>
  </div>

  <!-- Secondary Vitals: Speed & Missiles -->
  <div class="w-full px-4 py-0.5 flex items-center justify-between text-[10px] text-vanguard-textMuted bg-[#070B12]/90 border-b border-vanguard-border/30 shrink-0">
    <div class="flex items-center gap-2">
      <span>AIRSPEED:</span>
      <span id="speedDisplay" class="text-vanguard-cyan font-bold text-xs">140 M/S</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span>ORDNANCE:</span>
      <div id="missilePylons" class="flex gap-1 text-vanguard-amber font-bold">
        <span class="pylon px-1 rounded bg-vanguard-amber/20 border border-vanguard-amber/40">M1</span>
        <span class="pylon px-1 rounded bg-vanguard-amber/20 border border-vanguard-amber/40">M2</span>
        <span class="pylon px-1 rounded bg-vanguard-amber/20 border border-vanguard-amber/40">M3</span>
        <span class="pylon px-1 rounded bg-vanguard-amber/20 border border-vanguard-amber/40">M4</span>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 2b. POWER ROUTING TRI-DIVERT (Engines / Shields / Weapons / Balanced) -->
  <!-- ===================================================================== -->
  <div class="w-full px-3 py-1 bg-black/70 border-b border-vanguard-border/50 flex items-center justify-between gap-1.5 shrink-0 z-20">
    <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest hidden sm:inline">POWER:</span>
    <div class="flex-1 grid grid-cols-4 gap-1.5 max-w-xl mx-auto">
      <button id="pwrEngBtn" class="py-1 px-1 rounded border border-vanguard-cyan/40 bg-vanguard-cyan/10 hover:bg-vanguard-cyan/20 text-vanguard-cyan text-[10px] font-bold tracking-wider flex items-center justify-center gap-1 active:scale-95 transition-all">
        <span>⚡</span> <span class="truncate">ENGINES</span>
      </button>
      <button id="pwrShdBtn" class="py-1 px-1 rounded border border-emerald-500/40 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-[10px] font-bold tracking-wider flex items-center justify-center gap-1 active:scale-95 transition-all">
        <span>🛡️</span> <span class="truncate">SHIELDS</span>
      </button>
      <button id="pwrWpnBtn" class="py-1 px-1 rounded border border-vanguard-crimson/40 bg-vanguard-crimson/10 hover:bg-vanguard-crimson/20 text-vanguard-crimson text-[10px] font-bold tracking-wider flex items-center justify-center gap-1 active:scale-95 transition-all">
        <span>🔥</span> <span class="truncate">WEAPONS</span>
      </button>
      <button id="pwrBalBtn" class="py-1 px-1 rounded border-2 border-white/60 bg-white/20 text-white text-[10px] font-bold tracking-wider flex items-center justify-center gap-1 active:scale-95 transition-all">
        <span>⚖️</span> <span class="truncate">BALANCED</span>
      </button>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 3. MAIN COCKPIT FLIGHT CONTROLS (Split Thumb Envelopes)              -->
  <!-- ===================================================================== -->
  <main class="flex-1 relative flex overflow-hidden">
    
    <!-- LEFT ENVELOPE: Throttle Slider + Flight Stick (or Gyro Deck) -->
    <div class="w-1/2 h-full flex p-2 gap-2 relative">
      
      <!-- Continuous Vertical Throttle -->
      <div class="w-16 h-full flex flex-col items-center bg-vanguard-panel/70 border border-vanguard-border rounded-lg p-1.5 relative overflow-hidden select-none touch-none">
        <div class="text-[9px] font-bold text-vanguard-amber tracking-wider text-center shrink-0">BOOST</div>
        
        <!-- Throttle Track -->
        <div id="throttleTrack" class="flex-1 w-full bg-slate-950 rounded border border-vanguard-border/80 relative my-1 overflow-hidden">
          <!-- Throttle Fill -->
          <div id="throttleFill" class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-vanguard-cyanDim via-vanguard-cyan to-vanguard-amber transition-none" style="height: 50%;"></div>
          <!-- Throttle Handle Line -->
          <div id="throttleHandle" class="absolute inset-x-0 h-4 -mt-2 bg-white/90 border border-vanguard-cyan shadow-[0_0_10px_#00e5ff] rounded-sm pointer-events-none" style="bottom: 50%;"></div>
        </div>

        <div class="text-[9px] font-bold text-slate-400 tracking-wider text-center shrink-0">IDLE</div>
        <div id="throttlePctText" class="text-[10px] font-extrabold text-vanguard-cyan mt-0.5">50%</div>
      </div>

      <!-- Touch Flight Stick / Gyro Horizon Canvas -->
      <div class="flex-1 h-full flex flex-col">
        <!-- Main Stick Container -->
        <div id="stickZone" class="flex-1 bg-vanguard-panel/40 border border-vanguard-border/80 rounded-lg relative flex items-center justify-center overflow-hidden touch-none">
          
          <!-- Crosshair background markings -->
          <div class="absolute inset-x-0 top-1/2 h-px bg-vanguard-border/50 pointer-events-none"></div>
          <div class="absolute inset-y-0 left-1/2 w-px bg-vanguard-border/50 pointer-events-none"></div>
          <div class="w-36 h-36 rounded-full border border-vanguard-border/40 pointer-events-none flex items-center justify-center">
            <div class="w-20 h-20 rounded-full border border-vanguard-border/20"></div>
          </div>

          <!-- Virtual Joystick Knob -->
          <div id="stickKnob" class="w-16 h-16 rounded-full bg-gradient-to-br from-vanguard-cyan via-vanguard-cyanDim to-vanguard-deep border-2 border-white/80 shadow-cyan-glow flex items-center justify-center absolute pointer-events-none transform -translate-x-1/2 -translate-y-1/2 transition-none" style="left: 50%; top: 50%;">
            <div class="w-3 h-3 rounded-full bg-white shadow-[0_0_8px_#ffffff]"></div>
          </div>

          <!-- Gyro Horizon Overlay (Visible in Gyro Mode) -->
          <div id="gyroHorizon" class="hidden absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            <div id="gyroReticle" class="w-24 h-1 bg-vanguard-amber shadow-amber-glow transition-transform duration-75"></div>
            <div class="text-[10px] text-vanguard-amber font-bold mt-2">GYROSCOPE STEERING ENGAGED</div>
          </div>

          <div class="absolute bottom-1.5 left-2 text-[9px] text-slate-500 font-bold pointer-events-none">PITCH / ROLL</div>
        </div>

        <!-- Rudder / Yaw Pedals Bar -->
        <div class="h-10 mt-1.5 flex gap-1.5">
          <button id="yawLeftBtn" class="flex-1 rounded border border-vanguard-border bg-vanguard-panel/60 active:bg-vanguard-cyan/30 text-vanguard-cyan text-xs font-bold active:scale-95 transition-all flex items-center justify-center">
            ◀ YAW L
          </button>
          <button id="yawRightBtn" class="flex-1 rounded border border-vanguard-border bg-vanguard-panel/60 active:bg-vanguard-cyan/30 text-vanguard-cyan text-xs font-bold active:scale-95 transition-all flex items-center justify-center">
            YAW R ▶
          </button>
        </div>
      </div>
    </div>

    <!-- RIGHT ENVELOPE: Combat Weapons & Systems Triggers -->
    <div class="w-1/2 h-full flex flex-col p-2 gap-2 relative">
      
      <!-- Top Tactical Systems Row -->
      <div class="h-12 flex gap-2">
        <!-- Target Lock -->
        <button id="targetLockBtn" class="flex-1 rounded-lg border border-vanguard-border bg-vanguard-panel/70 active:bg-vanguard-amber/30 text-vanguard-amber text-xs font-bold tracking-wider active:scale-95 transition-all flex items-center justify-center gap-1.5">
          <span>⌖</span>
          <span>LOCK TARGET</span>
        </button>
        <!-- Nitro Boost -->
        <button id="nitroBoostBtn" class="w-24 rounded-lg border border-vanguard-amber/60 bg-vanguard-amber/10 active:bg-vanguard-amber/40 text-vanguard-amber text-xs font-extrabold tracking-wider active:scale-95 transition-all flex items-center justify-center">
          🔥 NITRO
        </button>
      </div>

      <!-- Heavy Strike Missile Launch Button -->
      <div class="h-20 flex">
        <button id="missileFireBtn" class="w-full h-full rounded-xl border-2 border-vanguard-amber/80 bg-gradient-to-r from-vanguard-amber/20 via-vanguard-panel to-vanguard-amber/10 active:from-vanguard-amber/50 active:to-vanguard-crimson/50 text-vanguard-amber font-display text-lg font-bold tracking-widest shadow-amber-glow active:scale-98 transition-all flex items-center justify-center gap-3">
          <span class="text-2xl">🚀</span>
          <div class="text-left">
            <div class="text-xs text-vanguard-amber/70 font-mono tracking-normal">SECONDARY ORDNANCE</div>
            <div class="font-black text-white">FIRE MISSILE</div>
          </div>
        </button>
      </div>

      <!-- Giant Primary Photon Cannon Trigger -->
      <div class="flex-1 flex">
        <button id="primaryFireBtn" class="w-full h-full rounded-2xl border-2 border-vanguard-cyan bg-gradient-to-br from-vanguard-cyan/25 via-vanguard-panel to-vanguard-cyan/10 active:from-vanguard-cyan/60 active:via-vanguard-cyanDim active:to-vanguard-cyan text-white font-display text-2xl font-black tracking-widest shadow-cyan-glow active:scale-98 transition-all flex flex-col items-center justify-center relative overflow-hidden group">
          <div class="absolute inset-0 bg-hud-grid bg-[length:16px_16px] opacity-20 pointer-events-none"></div>
          <div class="text-xs text-vanguard-cyan font-mono font-bold tracking-widest mb-1 group-active:text-white">PRIMARY CANNON</div>
          <div class="flex items-center gap-2">
            <span class="text-3xl text-vanguard-cyan group-active:text-white">⚡</span>
            <span class="text-2xl sm:text-3xl">PULSE LASER</span>
          </div>
          <div class="text-[10px] text-slate-400 font-mono mt-1 group-active:text-white">HOLD CONTINUOUS SALVO</div>
        </button>
      </div>

    </div>

  </main>

  <!-- ===================================================================== -->
  <!-- 4. PAIRING / CONFIGURATION MODAL (Initial Connect & Manual Override)  -->
  <!-- ===================================================================== -->
  <div id="configModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-vanguard-panel border border-vanguard-cyan/50 rounded-xl p-5 shadow-cyan-glow flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-vanguard-border pb-2">
        <div class="flex items-center gap-2">
          <span class="text-vanguard-cyan text-lg">🛰️</span>
          <h2 class="font-display font-bold text-white text-base tracking-wider">STATION LINK CONFIG</h2>
        </div>
        <button id="closeConfigBtn" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>

      <div class="flex flex-col gap-3 text-xs">
        <div>

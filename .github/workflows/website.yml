name: Website Build & Verification

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  build-website:
    name: Build & Verify Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website (Vite + Tailwind)
        working-directory: website
        run: npm run build

      - name: Verify build artifacts
        working-directory: website
        run: |
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          test -f dist/controller.html || { echo "dist/controller.html missing!"; exit 1; }
          echo "Production website artifacts verified successfully."

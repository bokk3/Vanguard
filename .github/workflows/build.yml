name: Build Project Vanguard

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_VERSION_STATUS: "stable"
  PROJECT_PATH: godot_project

jobs:
  # ─────────────────────────────────────────────────────────
  # BUILD MATRIX — one job per platform, self-contained
  # ─────────────────────────────────────────────────────────
  build:
    name: "Export — ${{ matrix.name }}"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: "Windows Desktop"
            artifact_name: project_vanguard_windows
            build_dir: /builds/windows
            output_file: /builds/windows/project_vanguard.exe
            zip_name: project_vanguard_windows.zip

          - name: Linux
            preset: "Linux/X11"
            artifact_name: project_vanguard_linux
            build_dir: /builds/linux
            output_file: /builds/linux/project_vanguard.x86_64
            zip_name: project_vanguard_linux.zip

          - name: macOS
            preset: "macOS"
            artifact_name: project_vanguard_macos
            build_dir: /builds/macos
            output_file: /builds/macos/project_vanguard.zip
            zip_name: project_vanguard_macos.zip

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Export templates come pre-installed in the godot-ci image at:
      # /root/.local/share/godot/export_templates/<version>.stable/
      # Godot's headless mode looks for them at the same path, so nothing to copy.

      - name: Create build output directory
        run: mkdir -p ${{ matrix.build_dir }}

      - name: Import project resources
        # --editor triggers the full import pipeline; --quit exits afterwards.
        # Errors during import (missing assets etc.) are non-fatal for export,
        # so we allow a non-zero exit here.
        run: |
          godot --headless --path $PROJECT_PATH --editor --quit || true

      - name: Export — ${{ matrix.name }}
        run: |
          godot --headless \
            --path $PROJECT_PATH \
            --export-release "${{ matrix.preset }}" \
            "${{ matrix.output_file }}"

      - name: Verify output exists
        run: |
          ls -lh ${{ matrix.output_file }} \
            || (echo "::error::Export produced no output file" && exit 1)

      - name: Package build
        run: |
          cd ${{ matrix.build_dir }}
          # macOS export is already a .zip; others need zipping
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp ${{ matrix.output_file }} /builds/${{ matrix.zip_name }}
          else
            zip -r /builds/${{ matrix.zip_name }} .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: /builds/${{ matrix.zip_name }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # RELEASE — fires only on v* tags, after all builds pass
  # ─────────────────────────────────────────────────────────
  release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: project_vanguard_*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Project Vanguard ${{ github.ref_name }}"
          body: |
            ## Project Vanguard ${{ github.ref_name }}

            Automated build — GitHub Actions.

            | Platform | Download |
            |---|---|
            | 🪟 Windows x86_64 | `project_vanguard_windows.zip` |
            | 🐧 Linux x86_64 | `project_vanguard_linux.zip` |
            | 🍎 macOS | `project_vanguard_macos.zip` |
          files: |
            project_vanguard_windows.zip
            project_vanguard_linux.zip
            project_vanguard_macos.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
